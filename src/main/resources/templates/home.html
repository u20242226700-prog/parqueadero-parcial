<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Parqueadero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar { background: #0d6efd; color: white; }
        .card-header { background-color: #f1f4f9; font-weight: bold; }
        .table thead { background-color: #212529; color: white; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🚗 GESTIÓN DE PARQUEADERO</a>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light btn-sm fw-bold" type="submit">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container">
        
        <div sec:authorize="hasRole('ADMINISTRADOR')" class="card shadow-sm mb-5">
            <div class="card-header border-bottom py-3">
                <h5 class="mb-0 text-primary text-uppercase small fw-bold">Nuevo Registro de Entrada</h5>
            </div>
            <div class="card-body bg-white p-4">
                <form th:action="@{/admin/registrar}" method="post" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold small">Placa</label>
                        <input type="text" name="placa" class="form-control text-uppercase" placeholder="ABC123" maxlength="6" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold small">Hora Entrada</label>
                        <input type="time" name="horaEntrada" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold small">Tipo de Vehículo</label>
                        <select name="tipo.id" class="form-select" required>
                            <option value="" disabled selected>Seleccione...</option>
                            <option th:each="t : ${tipos}" th:value="${t.id}" th:text="${t.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold small">Ubicación</label>
                        <input type="text" name="ubicacion" class="form-control" placeholder="Ej: A-10" required>
                    </div>
                    <div class="col-12 text-end mt-4">
                        <button type="submit" class="btn btn-success px-5 fw-bold shadow-sm text-uppercase">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header py-3">
                <h5 class="mb-0 small fw-bold text-uppercase">Vehículos en Patio</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead>
                            <tr>
                                <th class="ps-4">Placa</th>
                                <th>Tipo</th>
                                <th>Entrada</th>
                                <th>Ubicación</th>
                                <th sec:authorize="hasAnyRole('ADMINISTRADOR', 'ACOMODADOR')" class="text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="v : ${vehiculos}">
                                <td class="ps-4"><span class="badge bg-light text-dark border p-2 fw-bold" th:text="${v.placa}"></span></td>
                                <td th:text="${v.tipo != null ? v.tipo.nombre : 'N/A'}"></td>
                                <td th:text="${v.horaEntrada}"></td>
                                <td th:text="${v.ubicacion}"></td>
                                <td sec:authorize="hasAnyRole('ADMINISTRADOR', 'ACOMODADOR')">
                                    <form th:action="@{/acomodador/actualizar}" method="post" class="d-flex justify-content-center gap-2 px-3">
                                        <input type="hidden" name="id" th:value="${v.id}">
                                        <input type="text" name="ubicacion" class="form-control form-control-sm" style="width: 80px;" placeholder="Nueva" required>
                                        <button type="submit" class="btn btn-sm btn-warning fw-bold">Mover</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(vehiculos)}">
                                <td colspan="5" class="text-center py-5 text-muted small">No hay vehículos registrados en este momento.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <footer class="text-center mt-5 mb-3 text-muted small">
            &copy; 2024 Parqueadero Manager - Sistema de Gestión
        </footer>
    </div>
</body>
</html>
