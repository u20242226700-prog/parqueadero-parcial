<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Parqueadero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <div class="d-flex justify-content-between align-items-center">
        <h1>Gestión de Parqueadero</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-danger">Cerrar Sesión</button>
        </form>
    </div>

    <hr>

    <div sec:authorize="hasRole('ADMINISTRADOR')" class="card p-4 mb-4 shadow-sm">
        <h3>Registrar Entrada de Vehículo</h3>
        <form th:action="@{/admin/registrar}" method="post" class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Placa (Máx 6)</label>
                <input type="text" name="placa" class="form-control" maxlength="6" placeholder="ABC123" required>
            </div>
            
            <div class="col-md-3">
                <label class="form-label">Hora Entrada</label>
                <input type="time" name="horaEntrada" class="form-control" required>
            </div>
            
            <div class="col-md-2">
                <label class="form-label">Ubicación</label>
                <input type="text" name="ubicacion" class="form-control" placeholder="A-1" required>
            </div>
            
            <div class="col-md-4">
                <label class="form-label">Tipo de Vehículo</label>
                <select name="tipo.id" class="form-select" required>
                    <option value="" disabled selected>Seleccione un tipo...</option>
                    <option th:each="t : ${tipos}" 
                            th:value="${t.id}" 
                            th:text="${t.nombre}"></option>
                </select>
            </div>
            
            <div class="col-12 text-end">
                <button type="submit" class="btn btn-success">Guardar Registro</button>
            </div>
        </form>
    </div>

    <div class="mt-4">
        <h3>Vehículos en el Parqueadero</h3>
        <table class="table table-hover table-bordered align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Placa</th>
                    <th>Tipo</th>
                    <th>Hora Entrada</th>
                    <th>Ubicación</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="v : ${vehiculos}">
                    <td th:text="${v.placa}" class="fw-bold"></td>
                    <td th:text="${v.tipo != null ? v.tipo.nombre : 'N/A'}"></td>
                    <td th:text="${v.horaEntrada}"></td>
                    <td th:text="${v.ubicacion}"></td>
                    <td>
                        <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'ACOMODADOR')">
                            <form th:action="@{/acomodador/actualizar}" method="post" class="d-flex gap-2">
                                <input type="hidden" name="id" th:value="${v.id}">
                                <input type="text" name="ubicacion" class="form-control form-control-sm" placeholder="Nueva" required>
                                <button type="submit" class="btn btn-sm btn-warning">Mover</button>
                            </form>
                        </div>
                        <span sec:authorize="hasRole('CLIENTE')" class="badge bg-secondary">Lectura</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
